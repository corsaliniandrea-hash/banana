<html lang="it">
  <head>
    <meta charset="UTF-8" />

    <title>Poster Banana — Animazioni</title>
    <style>
      @font-face {
        font-family: ChiquitaNormal;
        src: url("assets/Chiquita Normal.ttf") format("truetype");
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      svg {
        width: auto;
        height: auto;
        max-width: 100vw;
        max-height: 100vh;
        display: block;
      }
      @keyframes slideRevealLine {
        0% {
          transform: translateX(-100%);
          opacity: 0;
        }
        100% {
          transform: translateX(0);
          opacity: 1;
        }
      }
      .poster-text-line {
        animation: slideRevealLine 0.6s ease-out both;
      }
      .poster-text-line:nth-of-type(1) {
        animation-delay: 0s;
      }
      .poster-text-line:nth-of-type(2) {
        animation-delay: 0.15s;
      }
      .poster-text-line:nth-of-type(3) {
        animation-delay: 0.3s;
      }
      @keyframes bananaBalance {
        0% {
          transform: rotate(0deg) translateX(0);
        }
        25% {
          transform: rotate(-4deg) translateX(-35px);
        }
        50% {
          transform: rotate(3deg) translateX(30px);
        }
        75% {
          transform: rotate(-2deg) translateX(-20px);
        }
        100% {
          transform: rotate(0deg) translateX(0);
        }
      }
      .poster-banana {
        transform-origin: 50% 85%;
        animation: bananaBalance 2.4s ease-in-out infinite;
      }
      @keyframes iconHalfRotate {
        0% {
          transform: rotate(-18deg);
        }
        50% {
          transform: rotate(18deg);
        }
        100% {
          transform: rotate(-18deg);
        }
      }
      .poster-icon {
        transform-origin: center;
        animation: iconHalfRotate ease-in-out infinite;
      }
      #icone_che_girano > .poster-icon:nth-child(1) {
        animation-duration: 1.6s;
        animation-delay: 0s;
      }
      #icone_che_girano > .poster-icon:nth-child(2) {
        animation-duration: 1.8s;
        animation-delay: 0.2s;
      }
      #icone_che_girano > .poster-icon:nth-child(3) {
        animation-duration: 2s;
        animation-delay: 0.4s;
      }
      #icone_che_girano > .poster-icon:nth-child(4) {
        animation-duration: 2.2s;
        animation-delay: 0.6s;
      }
      #icone_che_girano > .poster-icon:nth-child(5) {
        animation-duration: 1.7s;
        animation-delay: 0.1s;
      }
      #icone_che_girano > .poster-icon:nth-child(6) {
        animation-duration: 1.9s;
        animation-delay: 0.3s;
      }
      .text-cls-1 {
        fill: none;
        font-family: ChiquitaNormal, Chiquita;
        font-size: 379.9px;
        mix-blend-mode: multiply;
        stroke: red;
        stroke-miterlimit: 10;
        stroke-width: 10px;
      }
      .text-cls-2 {
        isolation: isolate;
      }
